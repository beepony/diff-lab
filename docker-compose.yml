services:
  diff-lab:
    build: .
    container_name: diff-lab
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - diff-lab-data:/app/data
    environment:
      - DIFF_LAB_DB=/app/data/diff_lab.db
      - DIFF_LAB_ADMIN_TOKEN=${DIFF_LAB_ADMIN_TOKEN:-}
      - TZ=Asia/Shanghai

volumes:
  diff-lab-data:
    driver: local
